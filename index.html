<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فريش ماركت - سوبر ماركت أونلاين</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@4.5.0/index.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #f8faf8;
            color: #2d3436;
            overflow-x: hidden;
        }

        /* Top Bar */
        .top-bar {
            background: #1a5e1a;
            color: white;
            padding: 8px 0;
            font-size: 13px;
        }

        .top-bar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        .header {
            background: white;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .logo-text h1 {
            font-size: 22px;
            color: #1a5e1a;
            line-height: 1.2;
        }

        .logo-text span {
            font-size: 11px;
            color: #888;
        }

        .search-bar {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 50px 12px 20px;
            border: 2px solid #e8e8e8;
            border-radius: 50px;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #27ae60;
            box-shadow: 0 0 0 3px rgba(39,174,96,0.1);
        }

        .search-bar button {
            position: absolute;
            left: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: #27ae60;
            border: none;
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-bar button:hover {
            background: #1a5e1a;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border: 2px solid #e8e8e8;
            border-radius: 50px;
            text-decoration: none;
            color: #2d3436;
            font-size: 14px;
            transition: all 0.3s;
            cursor: pointer;
            background: white;
        }

        .header-btn:hover {
            border-color: #27ae60;
            color: #27ae60;
        }

        .cart-btn {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
            position: relative;
        }

        .cart-btn:hover {
            background: #1a5e1a;
            color: white;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #e74c3c;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        /* Navigation */
        .nav-bar {
            background: white;
            border-top: 1px solid #f0f0f0;
        }

        .nav-bar .container {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 20px;
            overflow-x: auto;
        }

        .nav-link {
            padding: 14px 18px;
            text-decoration: none;
            color: #555;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            color: #27ae60;
            border-bottom-color: #27ae60;
        }

        .nav-link i {
            margin-left: 6px;
        }

        /* Hero Section */
        .hero {
            padding: 30px 0;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .hero-main {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            border-radius: 20px;
            padding: 50px;
            color: white;
            position: relative;
            overflow: hidden;
            min-height: 320px;
            display: flex;
            align-items: center;
        }

        .hero-main::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -20%;
            width: 400px;
            height: 400px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-badge {
            background: rgba(255,255,255,0.2);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
        }

        .hero-content h2 {
            font-size: 36px;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .hero-content p {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 25px;
        }

        .hero-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            color: #27ae60;
            padding: 14px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .hero-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .hero-side {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hero-card {
            flex: 1;
            border-radius: 20px;
            padding: 30px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .hero-card:first-child {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        .hero-card:last-child {
            background: linear-gradient(135deg, #f39c12, #e67e22);
        }

        .hero-card h3 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .hero-card p {
            font-size: 13px;
            opacity: 0.9;
        }

        .hero-card .discount {
            font-size: 32px;
            font-weight: 800;
            margin-top: 8px;
        }

        /* Categories */
        .categories {
            padding: 40px 0;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .section-header h2 {
            font-size: 26px;
            color: #1a5e1a;
        }

        .section-header a {
            color: #27ae60;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
        }

        .category-card {
            background: white;
            border-radius: 16px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            text-decoration: none;
            color: inherit;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(39,174,96,0.15);
            border-color: #27ae60;
        }

        .category-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 12px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .category-card:nth-child(1) .category-icon { background: #fff3e0; }
        .category-card:nth-child(2) .category-icon { background: #e8f5e9; }
        .category-card:nth-child(3) .category-icon { background: #fce4ec; }
        .category-card:nth-child(4) .category-icon { background: #e3f2fd; }
        .category-card:nth-child(5) .category-icon { background: #f3e5f5; }
        .category-card:nth-child(6) .category-icon { background: #fff8e1; }

        .category-card h4 {
            font-size: 14px;
            color: #2d3436;
        }

        .category-card span {
            font-size: 12px;
            color: #888;
        }

        /* Products */
        .products-section {
            padding: 40px 0;
        }

        .products-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 22px;
            border: 2px solid #e8e8e8;
            border-radius: 50px;
            background: white;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            transition: all 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
            border: 1px solid #f0f0f0;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        .product-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #e74c3c;
            color: white;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            z-index: 2;
        }

        .product-badge.new {
            background: #27ae60;
        }

        .product-wishlist {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.3s;
            z-index: 2;
            border: none;
            color: #ccc;
            font-size: 16px;
        }

        .product-wishlist:hover, .product-wishlist.active {
            color: #e74c3c;
        }

        .product-image {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #fafffe;
        }

        .product-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-info {
            padding: 18px;
        }

        .product-category {
            font-size: 12px;
            color: #27ae60;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .product-name {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #2d3436;
            line-height: 1.4;
        }

        .product-weight {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .product-price {
            display: flex;
            flex-direction: column;
        }

        .price-current {
            font-size: 20px;
            font-weight: 800;
            color: #27ae60;
        }

        .price-old {
            font-size: 13px;
            color: #bbb;
            text-decoration: line-through;
        }

        .add-to-cart {
            width: 42px;
            height: 42px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-to-cart:hover {
            background: #1a5e1a;
            transform: scale(1.1);
        }

        /* Features */
        .features {
            padding: 50px 0;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .feature-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
        }

        .feature-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .feature-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            background: #e8f5e9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #27ae60;
        }

        .feature-card h4 {
            font-size: 15px;
            margin-bottom: 5px;
            color: #2d3436;
        }

        .feature-card p {
            font-size: 13px;
            color: #888;
        }

        /* Deals Banner */
        .deals-banner {
            padding: 40px 0;
        }

        .deals-content {
            background: linear-gradient(135deg, #1a5e1a, #27ae60);
            border-radius: 20px;
            padding: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .deals-content::before {
            content: '';
            position: absolute;
            right: -100px;
            top: -100px;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }

        .deals-text h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .deals-text p {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .deals-timer {
            display: flex;
            gap: 15px;
        }

        .timer-box {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 12px 18px;
            border-radius: 12px;
            text-align: center;
            min-width: 70px;
        }

        .timer-box .number {
            font-size: 28px;
            font-weight: 800;
            display: block;
        }

        .timer-box .label {
            font-size: 11px;
            opacity: 0.8;
        }

        .deals-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            color: #1a5e1a;
            padding: 14px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .deals-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        /* Newsletter */
        .newsletter {
            padding: 50px 0;
        }

        .newsletter-content {
            background: white;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 5px 30px rgba(0,0,0,0.05);
        }

        .newsletter-content h2 {
            font-size: 26px;
            color: #1a5e1a;
            margin-bottom: 10px;
        }

        .newsletter-content p {
            color: #888;
            margin-bottom: 25px;
        }

        .newsletter-form {
            display: flex;
            max-width: 500px;
            margin: 0 auto;
            gap: 10px;
        }

        .newsletter-form input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e8e8e8;
            border-radius: 50px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
        }

        .newsletter-form input:focus {
            outline: none;
            border-color: #27ae60;
        }

        .newsletter-form button {
            padding: 14px 30px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 50px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .newsletter-form button:hover {
            background: #1a5e1a;
        }

        /* Footer */
        .footer {
            background: #1a2e1a;
            color: white;
            padding: 60px 0 30px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .footer-about h3 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #2ecc71;
        }

        .footer-about p {
            color: #aaa;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .footer-social {
            display: flex;
            gap: 10px;
        }
